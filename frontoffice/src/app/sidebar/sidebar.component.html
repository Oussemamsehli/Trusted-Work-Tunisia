<aside class="sidebar" [class.collapsed]="collapsed">

    <!-- Logo -->
    <div class="logo-area">
        <div class="logo-mark">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
                <defs>
                    <linearGradient id="lg" x1="0" y1="0" x2="32" y2="32">
                        <stop offset="0%" stop-color="#22D3EE" />
                        <stop offset="100%" stop-color="#0891B2" />
                    </linearGradient>
                </defs>
                <rect width="32" height="32" rx="9" fill="url(#lg)" />
                <path d="M10 12h12M10 16h8M10 20h10" stroke="#0f0f14" stroke-width="2.2" stroke-linecap="round" />
            </svg>
        </div>
        <div class="logo-text" *ngIf="!collapsed">
            <span class="logo-title">TrustedWork</span>
            <span class="logo-sub">Frontoffice</span>
        </div>
    </div>

    <!-- Toggle -->
    <button class="collapse-btn" (click)="toggleCollapse()">
        <span *ngIf="!collapsed">◀</span>
        <span *ngIf="collapsed">▶</span>
    </button>

    <!-- MENU -->
    <nav class="nav-block nav-main">
        <div class="nav-heading" *ngIf="!collapsed">Menu</div>

        <a *ngFor="let item of menuItems"
           class="sidebar-item"
           [class.active]="activeItem === item.id"
           (click)="setActive(item.id)">

            <div class="item-pill">
                <span class="item-indicator"
                      [style.background]="activeItem === item.id ? roleColor : 'transparent'">
                </span>

                <!-- ICON SIMPLE (fix) -->
                <span class="item-icon-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </span>

                <span class="item-label" *ngIf="!collapsed">
                    {{ item.label }}
                </span>
            </div>
        </a>
    </nav>

    <!-- SUPPORT -->
    <nav class="nav-block nav-support" *ngIf="supportItems.length > 0">
        <div class="nav-heading" *ngIf="!collapsed">Support</div>

        <a *ngFor="let item of supportItems"
           class="sidebar-item"
           [class.active]="activeItem === item.id"
           (click)="setActive(item.id)">

            <div class="item-pill">
                <span class="item-indicator"
                      [style.background]="activeItem === item.id ? roleColor : 'transparent'">
                </span>

                <span class="item-icon-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </span>

                <span class="item-label" *ngIf="!collapsed">
                    {{ item.label }}
                </span>
            </div>
        </a>
    </nav>

    <!-- LOGOUT -->
    <div class="sidebar-bottom">
        <a class="sidebar-item logout-item" (click)="onLogout()">
            <div class="item-pill">
                <span class="item-icon-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </span>

                <span class="item-label" *ngIf="!collapsed">
                    Déconnexion
                </span>
            </div>
        </a>
    </div>

</aside>
